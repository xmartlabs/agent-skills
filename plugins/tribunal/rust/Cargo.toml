[workspace]
resolver = "2"
members = ["crates/tribunal-core", "crates/tribunal-agent", "crates/tribunal-context", "crates/tribunal-pipeline", "crates/tribunal-cli"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
proptest = "1"
regex = "1"
regress = { version = "0.12.0", features = ["utf16"] }
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros", "io-util", "sync"] }
nix = { version = "0.29", features = ["signal"] }
oxc_allocator = "0.155.0"
oxc_ast = "0.155.0"
oxc_ast_visit = "0.155.0"
oxc_parser = { version = "0.155.0", default-features = false }
oxc_span = "0.155.0"
rquickjs = { version = "0.14.0", features = ["loader"] }

# QuickJS loads TypeScript (9 MB of JS) in the embedded engine; unoptimized C
# makes every test that needs it pay seconds.
[profile.dev.package.rquickjs-sys]
opt-level = 3

# The risk-path patterns run through regress and the wrapper in tribunal-core
# that gives them V8's semantics. Unoptimized, the long paths in
# diff_profile's long_paths_match_js took 16.9s on a Mac; with both optimized,
# 1s. opt-level 1 on tribunal-core costs nothing measurable on a rebuild and
# keeps debug assertions and overflow checks.
[profile.dev.package.regress]
opt-level = 3

[profile.dev.package.tribunal-core]
opt-level = 1
