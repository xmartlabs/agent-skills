name: Tribunal review
description: >-
  Runs the tribunal adversarial review on a pull request and posts its report.
  Independent reviewers read the diff, every serious finding faces a panel that tries to disprove
  it, and only the survivors are reported.
author: Xmartlabs

inputs:
  claude-token:
    description: >-
      Claude Code OAuth token from `claude setup-token` (uses that account's Claude subscription).
      Give this or `anthropic-api-key`. Store it as a secret.
    default: ''
  anthropic-api-key:
    description: >-
      Anthropic API key from the Console (billed per use). Give this or `claude-token`; when both
      are set, the API key is used. Store it as a secret.
    default: ''
  github-token:
    description: >-
      Token for reading the pull request and posting the review. The job needs
      `pull-requests: write` for it.
    default: ${{ github.token }}
  conventions-token:
    description: >-
      Optional read-only token for the repos a profile's `conventionSources` and `crossRepoAnchors`
      name. Fine-grained, with `Contents: read` on those repos. Empty reads them with `github-token`.
      `github-token` keeps everything on the reviewed repo, including posting. Store it as a secret.
    default: ''
  label:
    description: >-
      Adding this label forces a review, ignoring `drafts`, `paths` and `once`; another label skips.
      The action removes it when it ends, so adding it again starts a new review.
    default: tribunal
  needs-human-label:
    description: >-
      Label to add while the review says a person should look at the pull request, and to remove
      when it does not. Empty (default) leaves labels alone. Must differ from `label`. Needs
      Tribunal 115.9.0 or later and `pull-requests: write`.
    default: ''
  paths:
    description: >-
      Review only when a changed file matches one of these globs, one per line (`*` also crosses
      `/`, a leading `!` excludes). Empty reviews any change. The label ignores it.
    default: ''
  once:
    description: >-
      Skip a pull request the action already reviewed (a review of its own with tribunal's
      footer). The label ignores it.
    default: 'true'
  drafts:
    description: Also review draft pull requests. The label reviews drafts either way.
    default: 'false'
  reviewer:
    description: >-
      `frontend`, `backend`, `python` or `e2e`: the reviewer kind used when the repository has no
      `.claude/review-profile.json` of its own.
    default: frontend
  tribunal-version:
    description: 'Tribunal freeze to run: bundled, latest stable Tribunal freeze, or an exact x.y.z version (115.2.0+).'
    default: 'bundled'
  verdict:
    description: >-
      `comment` (default) always posts a comment; `suggested` posts the engine's verdict, approvals
      included; `no-approve` posts a change request when the engine asks for one and a comment
      otherwise, and dismisses the action's earlier change request once a review no longer asks for one.
    default: 'comment'
  review-mode:
    description: 'full (default), or incremental using a verified compatible baseline artifact.'
    default: 'full'
  codex:
    description: 'Enable the optional Codex refuter. Requires openai-api-key.'
    default: 'false'
  openai-api-key:
    description: 'OpenAI API key for Codex. Store as a secret; only used when codex is true.'
    default: ''
  codex-model:
    description: 'Optional Codex refuter model; empty uses the engine default.'
    default: ''
  bot-comments:
    description: 'Also vet existing bot comments; may increase review cost.'
    default: 'false'
  model:
    description: 'Claude model override; empty uses the engine default.'
    default: ''
  effort:
    description: 'Reasoning effort override: low, medium, high or max; empty uses the engine default.'
    default: ''
  concurrency:
    description: 'Positive maximum concurrent Claude dispatches; empty uses the engine default.'
    default: ''
  max-panels:
    description: 'Positive panel budget; empty uses the engine default.'
    default: ''
  max-agents:
    description: 'Positive agent budget; empty uses the engine default.'
    default: ''
  max-output-tokens:
    description: 'Positive output-token budget; empty uses the engine default.'
    default: ''
  prior-verify:
    description: 'Positive prior-finding verification limit; empty uses the engine default.'
    default: ''
  lens-samples:
    description: >-
      Independent samples per lens, 1 to 4; empty uses the engine default. The README's input
      table has the measured cost of `2` and when to use it.
    default: ''
  typecheck-dir:
    description: >-
      A checkout of the reviewed repository with its dependencies installed (for TypeScript,
      `node_modules`, plus a generated Prisma client where the repository uses Prisma), relative to
      the workspace or absolute. The grounded typecheck takes the packages and the `tsconfig` from
      it and types the pull request's head in a tree of its own. Empty skips the typecheck, and the
      review says so.
    default: ''
  findings-check:
    description: >-
      `off` (default), `inform` or `enforce`. Other than `off`, a posted review also leaves a
      "Tribunal findings" commit status on the reviewed commit with the count of open blocking and
      should-fix findings: `inform` keeps it green and says the count is not enforced, `enforce`
      marks it failed when any is open. Needs `statuses: write`; without it the review still posts
      and the summary says the status is missing.
    default: 'off'
  human-review-check:
    description: >-
      `off` (default) or `on`. When `on`, a posted review also leaves a "Tribunal human review"
      commit status on the reviewed commit: pending while the review says a person should look at
      the pull request, success when it does not. Needs Tribunal 115.9.0 or later and
      `statuses: write`; without it the review still posts and the job logs a warning. A commit
      the action does not review gets the status `human-review-on-skip` says.
    default: 'off'
  human-review-on-skip:
    description: >-
      The "Tribunal human review" status on a commit the action does not review (skipped by
      `drafts`, `paths`, `once`, a missing Claude credential or the engine), when
      `human-review-check` is `on`. `carry` (default) copies the status of the push's previous head
      (force-pushes included), else of the commit the action last reviewed, else of the newest
      earlier commit, or sets success when none has one; `success` marks it not reviewed;
      `pending` asks for a person. Not set on fork pull requests or for a label change.
    default: 'carry'
  upload-run:
    description: >-
      Upload the run record, the report and the logs as a workflow artifact. Never on a public
      repository (or one whose visibility the event does not state): they can quote code, and that
      repository's artifacts can be downloaded by anyone signed in.
    default: 'true'
  upload-transcripts:
    description: >-
      Also upload every model dispatch's transcript. Off by default: transcripts keep tool output
      verbatim. Never on a public repository, whatever this says.
    default: 'false'

outputs:
  posted:
    description: '`true` when the review was posted.'
    value: ${{ steps.post.outcome == 'success' }}
  blocking:
    description: Open blocking findings after the review; empty when `findings-check` is `off` or they could not be counted.
    value: ${{ steps.findings.outputs.blocking }}
  should-fix:
    description: Open should-fix findings after the review; empty when `findings-check` is `off` or they could not be counted.
    value: ${{ steps.findings.outputs.should-fix }}
  needs-human:
    description: '`true` when the review raised needsHuman, `false` when it did not, empty when no review ran or the engine predates 115.9.0.'
    value: ${{ steps.needs-human.outputs.needs-human }}
  approval:
    description: >-
      `true` on a `pull_request_review` event with `human-review-check: on`: the action checked
      whether the approval clears the "Tribunal human review" status. Empty otherwise.
    value: ${{ steps.gate.outputs.approval }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HAS_CLAUDE_AUTH: ${{ inputs.claude-token != '' || inputs.anthropic-api-key != '' }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_ONCE: ${{ inputs.once }}
        INPUT_DRAFTS: ${{ inputs.drafts }}
        INPUT_HUMAN_REVIEW_CHECK: ${{ inputs.human-review-check }}
        INPUT_HUMAN_REVIEW_ON_SKIP: ${{ inputs.human-review-on-skip }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" gate

    # A pull_request_review event: an approval by a person with write access may clear a pending
    # "Tribunal human review" status. The gate said run=false, so no other step runs.
    - if: steps.gate.outputs.approval == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" human-review-approve

    - id: node
      if: steps.gate.outputs.run == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/run.sh" node-check

    - if: steps.gate.outputs.run == 'true' && steps.node.outputs.missing == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - id: prepare
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HAS_CONVENTIONS_TOKEN: ${{ inputs.conventions-token != '' }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_NEEDS_HUMAN_LABEL: ${{ inputs.needs-human-label }}
        INPUT_REVIEWER: ${{ inputs.reviewer }}
        INPUT_TRIBUNAL_VERSION: ${{ inputs.tribunal-version }}
        INPUT_VERDICT: ${{ inputs.verdict }}
        INPUT_REVIEW_MODE: ${{ inputs.review-mode }}
        INPUT_CODEX: ${{ inputs.codex }}
        INPUT_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        INPUT_CODEX_MODEL: ${{ inputs.codex-model }}
        INPUT_BOT_COMMENTS: ${{ inputs.bot-comments }}
        INPUT_FINDINGS_CHECK: ${{ inputs.findings-check }}
        INPUT_HUMAN_REVIEW_CHECK: ${{ inputs.human-review-check }}
        INPUT_HUMAN_REVIEW_ON_SKIP: ${{ inputs.human-review-on-skip }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_EFFORT: ${{ inputs.effort }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_MAX_PANELS: ${{ inputs.max-panels }}
        INPUT_MAX_AGENTS: ${{ inputs.max-agents }}
        INPUT_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        INPUT_PRIOR_VERIFY: ${{ inputs.prior-verify }}
        INPUT_LENS_SAMPLES: ${{ inputs.lens-samples }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" prepare

    - id: restore
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" restore

    - id: review
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        TRIBUNAL_CONVENTIONS_TOKEN: ${{ inputs.conventions-token }}
        INPUT_TYPECHECK_DIR: ${{ inputs.typecheck-dir }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" review

    - id: needs-human
      if: steps.gate.outputs.run == 'true' && steps.review.outcome == 'success'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/run.sh" needs-human

    - id: post
      if: steps.gate.outputs.run == 'true' && steps.review.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" post

    - id: findings
      if: steps.gate.outputs.run == 'true' && steps.post.outcome == 'success' && inputs.findings-check != 'off'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_FINDINGS_CHECK: ${{ inputs.findings-check }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" findings-check

    - if: steps.gate.outputs.run == 'true' && steps.post.outcome == 'success' && inputs.human-review-check == 'on'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" human-review-check

    # The engine skipped instead of reviewing: the commit still gets its human review status.
    - if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && steps.review.outcome == 'success' && inputs.human-review-check == 'on' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_HUMAN_REVIEW_CHECK: ${{ inputs.human-review-check }}
        INPUT_HUMAN_REVIEW_ON_SKIP: ${{ inputs.human-review-on-skip }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" human-review-skip

    - if: steps.gate.outputs.run == 'true' && steps.post.outcome == 'success' && inputs.needs-human-label != '' && steps.needs-human.outputs.needs-human != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_NEEDS_HUMAN_LABEL: ${{ inputs.needs-human-label }}
        NEEDS_HUMAN: ${{ steps.needs-human.outputs.needs-human }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" needs-human-label

    - id: baseline
      if: steps.gate.outputs.run == 'true' && steps.post.outcome == 'success' && inputs.review-mode == 'incremental'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" baseline

    - if: steps.baseline.outputs.saved == 'true' && steps.gate.outputs.public == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: tribunal-baseline-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/tribunal/baseline/baseline.json
        if-no-files-found: error
        retention-days: 14

    # A cancelled run (a newer request, or by hand) stays silent; the newer run reports.
    - if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && steps.post.outcome != 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_LABEL: ${{ inputs.label }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" fallback

    - if: ${{ always() && steps.gate.outputs.run == 'true' }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/run.sh" summary

    - if: ${{ always() && steps.gate.outputs.run == 'true' && steps.gate.outputs.public == 'false' && inputs.upload-run == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: tribunal-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/tribunal/run.json
          ${{ runner.temp }}/tribunal/*.log
          ${{ runner.temp }}/tribunal/tmp/tribunal-report-*
        if-no-files-found: ignore
        retention-days: 14

    - if: ${{ always() && steps.gate.outputs.run == 'true' && steps.gate.outputs.public == 'false' && inputs.upload-transcripts == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: tribunal-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-transcripts
        path: ${{ runner.temp }}/tribunal/tmp/tribunal-transcripts-*
        if-no-files-found: ignore
        retention-days: 14

    - if: ${{ always() && steps.gate.outputs.run == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_LABEL: ${{ inputs.label }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" cleanup
