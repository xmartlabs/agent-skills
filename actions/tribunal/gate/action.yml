name: Tribunal review gate
description: >-
  Decides whether the tribunal action would review this pull request, without checking out or
  installing anything. Use it in a cheap job before the review job.
author: Xmartlabs

inputs:
  github-token:
    description: >-
      Token for reading the pull request's files and reviews, and, with `human-review-check: on`,
      for setting the human review status on a commit it skips (the job then needs
      `statuses: write`).
    default: ${{ github.token }}
  claude-token:
    description: >-
      Same as the tribunal action's input. Only whether it is set is read: a run without a
      credential (Dependabot's) is skipped.
    default: ''
  anthropic-api-key:
    description: Same as the tribunal action's input; only whether it is set is read.
    default: ''
  label:
    description: Same as the tribunal action's input.
    default: tribunal
  paths:
    description: Same as the tribunal action's input.
    default: ''
  once:
    description: Same as the tribunal action's input.
    default: 'true'
  drafts:
    description: Same as the tribunal action's input.
    default: 'false'
  human-review-check:
    description: >-
      Same as the tribunal action's input. When `on`, a commit the gate skips gets the
      "Tribunal human review" status `human-review-on-skip` says.
    default: 'off'
  human-review-on-skip:
    description: Same as the tribunal action's input.
    default: 'carry'

outputs:
  run:
    description: '`true` when the tribunal action would review.'
    value: ${{ steps.gate.outputs.run }}
  approval:
    description: >-
      `true` on a `pull_request_review` event with `human-review-check: on`: the tribunal action
      would check whether the approval clears the "Tribunal human review" status. Empty otherwise.
    value: ${{ steps.gate.outputs.approval }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HAS_CLAUDE_AUTH: ${{ inputs.claude-token != '' || inputs.anthropic-api-key != '' }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_ONCE: ${{ inputs.once }}
        INPUT_DRAFTS: ${{ inputs.drafts }}
        INPUT_HUMAN_REVIEW_CHECK: ${{ inputs.human-review-check }}
        INPUT_HUMAN_REVIEW_ON_SKIP: ${{ inputs.human-review-on-skip }}
      run: bash "$GITHUB_ACTION_PATH/../run.sh" gate
